name: stem-split
on:
  push:
    paths: ["jobs/sep/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs soundfile
      - name: Separate
        run: |
          set -e
          for f in jobs/sep/*.json; do
            src=$(python3 -c "import json;print(json.load(open('$f'))['src'])"); name=$(python3 -c "import json;print(json.load(open('$f'))['name'])")
            mkdir -p work library/media/stems
            ffmpeg -v error -y -i "$src" -vn -ac 2 -ar 44100 work/$name.wav
            python3 -m demucs --two-stems=vocals -n htdemucs_ft -o work/out work/$name.wav
            ffmpeg -v error -y -i work/out/htdemucs_ft/$name/vocals.wav library/media/stems/$name-vocals.flac
            ffmpeg -v error -y -i work/out/htdemucs_ft/$name/no_vocals.wav library/media/stems/$name-bed.flac
            git rm -q "$f"
          done
      - name: Commit
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A library/media/stems jobs/sep
          git commit -m "stem-split results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done; exit 1
