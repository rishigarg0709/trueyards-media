name: wa-ops
# The cloud route to the WhatsApp bot for agents (Rishi, 19 Nov 2026: everything in the cloud, no browser on his laptop).
# Push wa/requests/<name>.json and read wa/results/<name>.json, or start this by hand with an action name.
# Leave "op" empty to list every action. A new broadcast is held until Rishi replies GO on WhatsApp.
# This repo is public: the bot answers with counts and settings only, and no phone number may go in a request.
on:
  push:
    paths: ["wa/requests/*.json"]
  workflow_dispatch:
    inputs:
      op:
        description: "Action, for example switches or broadcasts (empty lists them all)"
        required: false
      args:
        description: "Arguments as JSON"
        default: "{}"
      by:
        description: "Your role, for example Paid Media Buyer"
        default: "SMX chat"
permissions:
  contents: write
concurrency: wa-ops
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the two small folders this job needs: a full checkout of this 2 GB repo took about 3 minutes a run.
          sparse-checkout: |
            scripts
            wa
      - name: Use the latest main (skip requests another run already answered)
        run: git pull --rebase -q origin main || true
      - name: Run
        env:
          PERF_URL: ${{ secrets.PERF_URL }}
          PERF_KEY: ${{ secrets.PERF_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'files' }}
          OP: ${{ github.event.inputs.op }}
          ARGS: ${{ github.event.inputs.args }}
          BY: ${{ github.event.inputs.by }}
        run: python3 scripts/wa_ops.py
      - name: Commit answers
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A wa/results
          git commit -m "wa-ops results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done; exit 1
