name: plan3d
# Exact-layout reference renders of the FIT plan (render3d/fit/plan.py), one task per machine.
on:
  push:
    paths: ['render3d/fit/plan_job.json']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: plan3d, cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {task: [0, 1, 2, 3, 4, 5, 6, 7]}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: render3d, sparse-checkout-cone-mode: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install Blender as a Python module
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q bpy==5.3.0 shapely
      - name: Render
        run: |
          cd render3d/fit
          ARGS=$(python3 -c "import json;t=json.load(open('plan_job.json'))['tasks'];i=$((${{ matrix.task }}));print(t[i] if i < len(t) else '')")
          if [ -z "$ARGS" ]; then echo "no task"; mkdir -p out; exit 0; fi
          echo "$ARGS"
          python3 plan.py --layout layout.json --out out $ARGS 2>&1 | grep -E "^rendered|clipped|Error|Traceback|line [0-9]" || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: "plan-${{ matrix.task }}", path: "render3d/fit/out/*", retention-days: 7, if-no-files-found: ignore}
  commit:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'plan-*', merge-multiple: true, path: out}
      - uses: actions/checkout@v4
        with: {path: repo, sparse-checkout: "library/web", sparse-checkout-cone-mode: false}
      - name: Commit the renders to library/web/fitplan
        run: |
          cd repo
          D=library/web/fitplan; mkdir -p $D; cp ../out/* $D/ 2>/dev/null || true
          git config user.name "plan3d"; git config user.email "plan3d@users.noreply.github.com"
          git add --sparse $D && git commit -q -m "plan3d: FIT plan reference renders (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*5)); done
