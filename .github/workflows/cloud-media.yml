name: cloud-media
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/cloud_media.py
      - name: Free 4K upscale of new images
        continue-on-error: true
        timeout-minutes: 25
        run: |
          git status --porcelain --untracked-files=all library/media | grep -q '\.png$' || { echo "no new images"; exit 0; }
          pip install -q --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q spandrel pillow numpy
          python3 scripts/upscale.py
      - name: Commit results
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A library/media jobs batches ops
          git commit -m "cloud-media results" || exit 0
          git pull --rebase -q && git push
