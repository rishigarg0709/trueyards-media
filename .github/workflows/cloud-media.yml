name: cloud-media
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/cloud_media.py
      - name: Commit results
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A library/media jobs
          git commit -m "cloud-media results" || exit 0
          git pull --rebase -q && git push
