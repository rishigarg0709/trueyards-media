name: batch-poll
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: batch-poll
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pending batches
        run: |
          ls batches/pending/*.json >/dev/null 2>&1 || { echo "nothing pending"; exit 0; }
          python3 scripts/cloud_media.py poll
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A batches library/media
          git commit -m "batch-poll results" || exit 0
          git pull --rebase -q && git push
