name: social-ops
on:
  push:
    paths: ["social/requests/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: social-ops
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest main
        run: git pull --rebase -q origin main || true
      - name: Run cross-post requests
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/social_ops.py
      - name: Commit results
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A social
          git commit -m "social-ops results" || exit 0
          git pull --rebase -q && git push
