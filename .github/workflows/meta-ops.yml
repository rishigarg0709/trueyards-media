name: meta-ops
on:
  push:
    paths: ["meta/requests/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: meta-ops
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Meta requests
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 scripts/meta_ops.py
      - name: Commit results
        run: |
          git config user.name "trueyards-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A meta
          git commit -m "meta-ops results" || exit 0
          git pull --rebase -q && git push
