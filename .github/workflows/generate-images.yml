name: generate-images
on:
  push:
    paths:
      - 'gen/*.json'
permissions:
  contents: write
concurrency: generate-images
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate with Cloudflare Workers AI
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, glob, os, re, base64, urllib.request, sys
          tok=os.environ.get("CF_API_TOKEN",""); acc=os.environ.get("CF_ACCOUNT_ID","")
          os.makedirs("library/gen",exist_ok=True)
          log=[]
          if not tok or not acc:
              log.append("missing CF_API_TOKEN or CF_ACCOUNT_ID secret")
          for f in sorted(glob.glob("gen/*.json")):
              try: items=json.load(open(f))
              except Exception as e: log.append(f"{f}: bad json {e}"); items=[]
              for it in items[:24]:
                  if not tok or not acc: break
                  name=re.sub(r"[^A-Za-z0-9_-]","",str(it.get("name","")))[:60] or "image"
                  model=it.get("model","@cf/black-forest-labs/flux-1-schnell")
                  if not model.startswith("@cf/"): log.append(f"{name}: bad model"); continue
                  prompt=str(it.get("prompt",""))[:3000]
                  url=f"https://api.cloudflare.com/client/v4/accounts/{acc}/ai/run/{model}"
                  if "flux-2" in model:
                      fields={"prompt":prompt,"width":str(int(it.get("width",1024))),"height":str(int(it.get("height",1024)))}
                      if "steps" in it: fields["steps"]=str(int(it["steps"]))
                      bd="----ty"+os.urandom(8).hex()
                      data="".join(f"--{bd}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n" for k,v in fields.items())+f"--{bd}--\r\n"
                      req=urllib.request.Request(url,data=data.encode(),headers={"Authorization":"Bearer "+tok,"Content-Type":"multipart/form-data; boundary="+bd})
                  else:
                      req=urllib.request.Request(url,data=json.dumps({"prompt":prompt[:2000],"steps":int(it.get("steps",8))}).encode(),headers={"Authorization":"Bearer "+tok,"Content-Type":"application/json"})
                  try:
                      raw=urllib.request.urlopen(req,timeout=180).read()
                      try:
                          img=base64.b64decode(json.loads(raw)["result"]["image"])
                      except Exception:
                          img=raw
                      open(f"library/gen/{name}.jpg","wb").write(img); log.append(f"{name}: ok {len(img)} bytes")
                  except Exception as e:
                      detail=getattr(e,"read",lambda:b"")()[:300]
                      log.append(f"{name}: failed {e} {detail!r}")
              os.remove(f)
          open("library/gen/_last_run.txt","w").write("\n".join(log)+"\n")
          print("\n".join(log))
          PY
      - name: Commit
        run: |
          git config user.name "trueyards-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A library/gen gen
          git diff --cached --quiet || git commit -m "Generate images"
          git pull --rebase -q
          git push
