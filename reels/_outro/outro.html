<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0F1A17;font-family:Inter,sans-serif}
#bg{position:absolute;inset:-40px;background:url(bg.jpg) center/cover;filter:blur(0px) brightness(1)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,26,23,.35),rgba(15,26,23,.82));opacity:0}
.card{position:absolute;left:90px;right:90px;top:560px;background:#fff;border-radius:44px;padding:56px 56px 52px;box-shadow:0 40px 90px rgba(0,0,0,.45);opacity:0}
.top{display:flex;align-items:center;gap:34px}
.av{width:168px;height:168px;border-radius:50%;background:#fff;border:6px solid #28c39d;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{width:120px;height:120px;object-fit:contain}
.nm{font-weight:800;font-size:60px;color:#0F1A17;display:flex;align-items:center;gap:14px}
.tick{width:46px;height:46px;border-radius:50%;background:#3897f0;display:inline-flex;align-items:center;justify-content:center}
.hd{font-size:36px;color:#6b7a75;margin-top:6px}
.bio{font-size:40px;color:#0F1A17;margin:34px 0 40px;font-weight:600}
.row{display:flex;gap:24px}
.btn{flex:1;height:120px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;position:relative;overflow:hidden}
#follow{background:#28c39d;color:#fff}
#follow.on{background:#EEF2F1;color:#0F1A17}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);width:40px;height:40px;transform:translate(-50%,-50%) scale(0)}
#likeb{flex:0 0 120px;background:#EEF2F1}
#heart{width:62px;height:62px}
.hp{position:absolute;width:56px;height:56px;opacity:0}
#hand{position:absolute;width:150px;height:150px;opacity:0;z-index:9}
#line{position:absolute;left:0;right:0;top:1230px;text-align:center;color:#fff;font-weight:800;font-size:78px;letter-spacing:-.01em;opacity:0}
#line b{background:#28c39d;padding:0 18px;border-radius:10px}
#dots{position:absolute;left:0;right:0;top:1370px;display:flex;justify-content:center;gap:26px}
.d{width:70px;height:70px;border-radius:18px;border:4px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;color:#fff;font:600 24px 'Inter';opacity:0}
.d.f{background:#28c39d;border-color:#28c39d}
</style></head><body>
<div id="bg"></div><div id="shade"></div>
<div class="card" id="card">
 <div class="top"><div class="av"><img src="trueyards-icon.png"></div>
  <div><div class="nm">TrueYards <span class="tick"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#fff" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span></div><div class="hd">@trueyards.in</div></div></div>
 <div class="bio">Real estate, explained. One story a day.</div>
 <div class="row"><div class="btn" id="follow"><span id="ft">Follow</span></div>
  <div class="btn" id="likeb"><svg id="heart" viewBox="0 0 24 24"><path id="hpath" fill="none" stroke="#0F1A17" stroke-width="2" d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg></div></div>
</div>
<svg id="hand" viewBox="0 0 64 64"><path fill="#fff" stroke="#0F1A17" stroke-width="2.2" stroke-linejoin="round" d="M24 30V10a4 4 0 0 1 8 0v16l2-.3a4 4 0 0 1 4.5 3.2l.2 1 1.5-.3a4 4 0 0 1 4.6 3.1l.2.9 1.4-.2a4 4 0 0 1 4.6 3.4l1.3 9.2c.8 6-3 11.5-9 12.7L36 60c-4.2.8-8.4-.9-10.9-4.3L14 40.5a4 4 0 0 1 6.3-5L24 40z"/></svg>
<div id="line">Like. <b>Follow.</b> Learn.</div>
<div id="dots"></div>
<script>
const E=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))), ease=x=>1-Math.pow(1-x,3), back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const T=window.TIMES||{like:1.22,follow:2.14,story:4.41,every:4.97,end:5.8};
const days=['M','T','W','T','F','S','S'], dots=document.getElementById('dots');
days.forEach(d=>{const e=document.createElement('div');e.className='d';e.textContent=d;dots.appendChild(e)});
const hp=[];for(let i=0;i<7;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.classList.add('hp');s.innerHTML='<path fill="#ff3b5c" d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/>';document.body.appendChild(s);hp.push(s)}
const rip=document.createElement('div');rip.className='ripple';document.getElementById('follow').appendChild(rip);
window.setT=function(t){
 const bgp=ease(E(t,0,0.6));
 document.getElementById('bg').style.filter=`blur(${bgp*26}px) brightness(${1-bgp*.25})`;
 document.getElementById('shade').style.opacity=bgp;
 const c=back(E(t,0.15,0.75)); const card=document.getElementById('card');
 card.style.opacity=E(t,0.15,0.4); card.style.transform=`translateY(${(1-c)*160}px) scale(${0.94+0.06*c})`;
 // like
 const lk=E(t,T.like-0.05,T.like+0.25); const hpath=document.getElementById('hpath');
 if(t>=T.like){hpath.setAttribute('fill','#ff3b5c');hpath.setAttribute('stroke','#ff3b5c')}else{hpath.setAttribute('fill','none');hpath.setAttribute('stroke','#0F1A17')}
 document.getElementById('heart').style.transform=`scale(${t>=T.like?1+0.45*Math.sin(Math.PI*E(t,T.like,T.like+0.35)):1})`;
 const lb=document.getElementById('likeb').getBoundingClientRect();
 hp.forEach((h,i)=>{const p=E(t,T.like+i*0.05,T.like+0.9+i*0.05);const ang=-90+(i-3)*22;const r=p*(220+i*12);
  h.style.left=(lb.left+lb.width/2-28+Math.cos(ang*Math.PI/180)*r*0.6)+'px';h.style.top=(lb.top+lb.height/2-28+Math.sin(ang*Math.PI/180)*r)+'px';
  h.style.opacity=p>0&&p<1?(1-p):0;h.style.transform=`scale(${0.6+p*0.8}) rotate(${(i-3)*12}deg)`;});
 // hand: moves to like, then to follow
 const fb=document.getElementById('follow').getBoundingClientRect(), hand=document.getElementById('hand');
 const p1=ease(E(t,T.like-0.55,T.like-0.05)), p2=ease(E(t,T.like+0.3,T.follow-0.05));
 const x0=880,y0=1500, xl=lb.left+lb.width/2-40, yl=lb.top+lb.height/2-20, xf=fb.left+fb.width/2-40, yf=fb.top+fb.height/2-20;
 let hx=x0+(xl-x0)*p1, hy=y0+(yl-y0)*p1; hx+= (xf-xl)*p2; hy+=(yf-yl)*p2;
 const press=(Math.max(0,1-Math.abs(t-T.like)/0.12)+Math.max(0,1-Math.abs(t-T.follow)/0.12));
 hand.style.left=hx+'px';hand.style.top=hy+'px';hand.style.transform=`scale(${1-0.12*press})`;
 hand.style.opacity=E(t,T.like-0.6,T.like-0.35)*(1-E(t,T.follow+0.5,T.follow+0.8));
 // follow
 const f=document.getElementById('follow'), ft=document.getElementById('ft');
 if(t>=T.follow){f.classList.add('on');ft.textContent='Following ✓'}else{f.classList.remove('on');ft.textContent='Follow'}
 const rp=E(t,T.follow,T.follow+0.5); rip.style.left=(f.offsetWidth/2)+'px';rip.style.top=(f.offsetHeight/2)+'px';rip.style.transform=`translate(-50%,-50%) scale(${rp*22})`;rip.style.opacity=rp>0?(1-rp):0;
 f.style.transform=`scale(${1-0.05*Math.max(0,1-Math.abs(t-T.follow)/0.15)})`;
 // line + dots
 const l=ease(E(t,T.follow+0.4,T.follow+0.9)); const line=document.getElementById('line'); line.style.opacity=l; line.style.transform=`translateY(${(1-l)*30}px)`;
 [...dots.children].forEach((d,i)=>{const a=T.story-0.1+i*((T.end-0.3-T.story)/7); d.style.opacity=ease(E(t,T.story-0.5,T.story-0.1)); d.classList.toggle('f',t>=a); d.style.transform=`scale(${t>=a?1+0.18*Math.max(0,1-(t-a)/0.2):1})`;});
};
</script></body></html>
